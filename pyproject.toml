[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "melt"
version = "1.0.0"
description = "Modern YouTube downloader CLI with subtitle cleaning and parallel processing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "rich>=13.0.0",
    "yt-dlp>=2023.0.0",
]

[project.urls]
Source = "https://github.com/user/melt"

[tool.setuptools]
packages = ["utils", "components"]
