name: Build macOS (artifact only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pyinstaller yt-dlp rich mutagen pillow
      - name: Install ffmpeg
        run: brew install ffmpeg
      - run: cp "$(which ffmpeg)" ffmpeg
      - run: pyinstaller --onefile --add-data "sounds:sounds" --add-binary "ffmpeg:." --noupx --name melt --distpath dist --clean --noconfirm main.py
      - run: mv dist/melt dist/melt-macos
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: melt-macos
          path: dist/melt-macos
