name: Build & Test

on:
  push:
    branches: [main, master]
    paths:
      - '**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check . --ignore=E501,F401

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/ -v

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: pip install -r requirements.txt pyinstaller
      - name: Ensure icon exists
        run: if (-not (Test-Path "bin/windows/icon.ico")) { python generate_icon.py }
      - name: Download ffmpeg
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp" -Force
          Copy-Item "ffmpeg_temp\ffmpeg*\bin\ffmpeg.exe" "ffmpeg.exe"
          Remove-Item -Recurse -Force "ffmpeg.zip", "ffmpeg_temp"
      - name: Build .exe
        run: pyinstaller --onefile --console --name "melt" --icon "bin/windows/icon.ico" --add-data "config/config.json;config" --add-data "sounds;sounds" --add-data "ffmpeg.exe;." --hidden-import "rich" --hidden-import "yt_dlp" main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: melt-windows
          path: dist/melt.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: pip install -r requirements.txt pyinstaller
      - name: Download ffmpeg
        run: |
          wget -q "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" -O "ffmpeg.tar.xz"
          tar -xf "ffmpeg.tar.xz" --strip=1 --wildcards '*/ffmpeg'
          rm -f "ffmpeg.tar.xz"
      - name: Build binary
        run: pyinstaller --onefile --console --name "melt" --add-data "config/config.json:config" --add-data "sounds:sounds" --add-data "ffmpeg:." main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: melt-linux
          path: dist/melt

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: pip install -r requirements.txt pyinstaller
      - name: Download ffmpeg
        run: |
          curl -L "https://evermeet.cx/ffmpeg/ffmpeg-7.1.zip" -o "ffmpeg.zip" -s
          unzip -o "ffmpeg.zip" -d "." 2>/dev/null
          rm -f "ffmpeg.zip"
          chmod +x ffmpeg
      - name: Build binary
        run: pyinstaller --onefile --console --name "melt" --add-data "config/config.json:config" --add-data "sounds:sounds" --add-data "ffmpeg:." main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: melt-macos
          path: dist/melt
